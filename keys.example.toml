# Node keys for the HOPR Wireshark dissector.
#
# Point Wireshark at this file under Edit → Preferences → Protocols → HOPR → "Node key file",
# or pass it on the command line:
#
#     tshark -o hopr.key_file:/path/to/keys.toml -r capture.pcapng
#
# Only packet (offchain) keys are needed. The dissector works the rest out for itself:
#
#   * which node is at each end of a connection comes from the `/plaintext/2.0.0` handshake;
#   * a node's on-chain key identifier is learned by watching where relayed packets end up;
#   * the openers that decrypt reply traffic are rebuilt from the SURBs that carried it.
#
# A node whose key is missing is not a hard failure: its traffic is shown as ciphertext, and
# packets that merely pass through it still decrypt at every hop whose key is present.


# ── The whole cluster at once ─────────────────────────────────────────────────────────────
#
# The identity files are the ones hoprd itself runs with — the same files `--identity` points at,
# read with the same code — so nothing has to be extracted from them first. A local cluster keeps
# all of them in one directory under one password, which is this one line:
#
#   identity_dir = "../hoprnet/sdk/identities"
#   identity_password = "e2e-test"
#
# Relative paths resolve against this file's directory. Every file in the directory that is a
# keystore is loaded, whatever it is called, and each node is labelled with its file name;
# anything that is not a keystore (a README, a stray backup) is skipped. A keystore that will not
# open with the given password is an error rather than a skip, so a mistyped password says so
# instead of leaving you with no keys and no explanation.


# ── Or node by node ───────────────────────────────────────────────────────────────────────

[[node]]
# Label shown in the dissection. Defaults to a short form of the public key.
name = "entry"
# The identity file this node runs with, and the password it was encrypted under. `password` may
# be left out if a file-level `identity_password` is set above.
identity_file = "/path/to/hopr-node_1.id"
password = "e2e-test"

[[node]]
name = "relay"
identity_file = "/path/to/hopr-node_2.id"
password = "e2e-test"
# A node whose key you happen to hold as raw hex can give it directly instead of naming a file —
# 64 hex digits, `0x` prefix optional:
#
#   packet_key = "0x5eb2…e906"
#
# Written elided on purpose. A full-length key here would be a key in a public example file: it
# reads as real to anyone skimming, and to every secret scanner that sees the repository.

[[node]]
name = "exit"
identity_file = "/path/to/hopr-node_3.id"
password = "e2e-test"
# Optional. The four-byte identifier the chain assigned this node, which packet headers name the
# next hop by. Giving it makes relay labels appear on the first pass over a capture instead of the
# second; leaving it out costs nothing else, since the dissector learns it from the traffic.
# key_id = 2
