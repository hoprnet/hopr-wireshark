# Node keys for the HOPR Wireshark dissector.
#
# Point Wireshark at this file under Edit → Preferences → Protocols → HOPR → "Node key file",
# or pass it on the command line:
#
#     tshark -o hopr.key_file:/path/to/keys.toml -r capture.pcapng
#
# Only packet (offchain) keys are needed. The dissector works the rest out for itself:
#
#   * which node is at each end of a connection comes from the `/plaintext/2.0.0` handshake;
#   * a node's on-chain key identifier is learned by watching where relayed packets end up;
#   * the openers that decrypt reply traffic are rebuilt from the SURBs that carried it.
#
# A node whose key is missing is not a hard failure: its traffic is shown as ciphertext, and
# packets that merely pass through it still decrypt at every hop whose key is present.


# The quickest way to cover a local cluster: every identity file in one directory, under one
# password. Relative paths resolve against this file's directory. Files are taken in name order,
# and each node is labelled with its file name.
#
#   identity_dir = "../hoprnet/sdk/identities"
#   identity_password = "local"


# Or list the nodes one by one.

[[node]]
# Label shown in the dissection. Defaults to a short form of the public key.
name = "entry"
# The packet key, as hex. `0x` prefix optional.
packet_key = "0x5eb212d4d6aa5948c4f71574d45dad43afef6d330edb873fca69d0e1b197e906"

[[node]]
name = "relay"
# Or take it from the encrypted identity file the node runs with.
identity_file = "/path/to/hopr-node_2.id"
password = "local"

[[node]]
name = "exit"
packet_key = "0x9dec751c00f49e50fceff7114823f726a0425a68a8dc6af0e4287badfea8f4a4"
# Optional. The four-byte identifier the chain assigned this node, which packet headers name the
# next hop by. Giving it makes relay labels appear on the first pass over a capture instead of the
# second; leaving it out costs nothing else, since the dissector learns it from the traffic.
# key_id = 2
